name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        # Explicit file list: Node 22 doesn't accept a directory argument for --test.
        run: node --test tests/unit/*.test.mjs
      - name: Browser integration suite and UI walkthrough
        run: |
          python3 scripts/serve.py 8765 &
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium)" npm run test:browser

  cross-browser:
    # Chromium, Firefox, WebKit and two phone profiles, plus an axe-core accessibility scan.
    # Runs in Playwright's own image: its WebKit build is stable here, unlike `playwright install --with-deps`
    # on the bare runner (where WebKit crashed mid-suite). Keep the tag in step with package.json.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Cross-browser suite
        run: |
          python3 scripts/serve.py 8765 &
          sleep 2
          node scripts/pw-suite.mjs http://localhost:8765 ./.test-output/pw
      - name: Keep screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-report
          path: .test-output/pw
          retention-days: 14

  deploy:
    # GitHub Pages is published from here, and only after both test jobs pass on main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, cross-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
